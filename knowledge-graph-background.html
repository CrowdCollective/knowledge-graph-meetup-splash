<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge graph background</title>
<style>
  html,body{margin:0;height:100%;background:#FFFFFF}
  :root{
    --cc-dark:#000F1F; --cc-purple:#B7B3F9; --cc-green:#7CEEB7; --cc-yellow:#F9EA85;
    --cc-cool:#E0DFD6; --cc-urban:#A6A3A0; --cc-deep:#5E5D59; --cc-bright:#FFFFFF;
  }
  /* The container is whatever you want the graph behind. Position it, give it a size,
     and the canvas fills it. Put your own content on top with a higher z-index. */
  #kg-bg{position:fixed;inset:0;z-index:0;background:#8E877C}
  #kg-bg.dark{background:radial-gradient(120% 90% at 65% 40%, #0B2A4C 0%, #04182F 40%, var(--cc-dark) 78%)}
  #kg-bg.light{background:radial-gradient(120% 90% at 60% 40%, #FFFFFF 0%, #FAF8F3 45%, #F1EDE4 100%)}
  /* silk: procedurally generated linen drawn by the shader behind the graph */
  #kg-bg.silk{background:#8E877C} /* same tone as the veiled cloth, so nothing shows through while the canvas resizes */

  /* Hero copy, sits above the canvas */
  .kg-copy{
    position:absolute;left:clamp(20px,5vw,72px);right:clamp(20px,5vw,72px);top:50%;transform:translateY(-50%);
    z-index:1;max-width:1100px;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    text-shadow:0 1px 18px rgba(40,32,24,.18);
  }
  .kg-copy h1{margin:0;font-weight:400;font-size:clamp(40px,7vw,104px);line-height:1.05;letter-spacing:-.015em}
  .kg-copy p{margin:28px 0 0;font-size:clamp(17px,2vw,30px);line-height:1.45;font-weight:400;max-width:34em}
  .kg-meta{display:flex;flex-wrap:wrap;gap:14px 40px;margin-top:34px;font-size:clamp(14px,1.5vw,22px);list-style:none;padding:0}
  .kg-meta li{display:inline-flex;align-items:center;gap:12px}
  .kg-meta svg{width:1.05em;height:1.05em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @media (max-width:720px){ .kg-copy{top:auto;bottom:80px;transform:none} }


</style>
</head>
<body>

<div id="kg-bg" class="silk">
  <div class="kg-copy">
    <h1>Grounding AI:<br>Reasoning Layers<br>and Factual Graphs</h1>
    <p>Building reasoning layers to keep LLMs honest,<br>or bypassing them entirely for pure computation.</p>
    <ul class="kg-meta">
      <li><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>30th of September 2026</li>
      <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>16:30&#8211;20:30</li>
      <li><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Crowd Collective Office, Keilaranta 4, Espoo</li>
    </ul>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/**
 * KnowledgeGraphBackground(container, options)
 * Mounts a transparent WebGL canvas into `container` (any positioned element).
 * Pointer input is read from `options.pointerTarget` (default: window), so the
 * graph still reacts when your content sits on top of it.
 *
 * Returns { destroy() }.
 */
function KnowledgeGraphBackground(container, opts){
  opts = Object.assign({
    nodes: 150,
    pointerTarget: window,
    anchorX: 0.6,        // 0..1, where the graph's centre of mass sits horizontally
    anchorY: 0.5,
    drift: false,      // slow idle spin of the whole graph
    tilt: 0,           // how much the graph tilts toward the mouse (0 = none, 0.08 = subtle)
    activity: 0.35,    // 0..1 overall amount of signals and motion (1 = busy)
    fabric: false,     // draw a procedurally generated cream linen behind the graph
    fabricColors: { light:0xFFFDF8, base:0xF3EDE2, shade:0xDCCFBC, deep:0xB9A98F },
    wave: 1,           // how much the cloth moves (0 = still)
    fabricShade: 0.42, // 0..1 darkening veil over the cloth (the site's hero uses a dark tint so white text reads)
    theme: 'dark',     // 'dark' (brand navy), 'light' (white + beige), 'silk' (over the hero fabric photo)
    colors: null,
  }, opts||{});
  const THEMES = {
    dark: { node:0xE0DFD6, ring:0xB7B3F9, edge:0x4E4A9E, signal:0x7CEEB7, signalCore:0xFFFFFF, glow:0xB7B3F9, glowAlpha:1,
            fog:0x000F1F, ambient:0xB7B3F9, key:0xFFFFFF, rim:0x7CEEB7, emissive:0x1A1A4A,
            edgeOpacity:0.55, blending:THREE.AdditiveBlending, fogDensity:0.028 },
    light:{ node:0xC4B8A4, ring:0x9A8F7E, edge:0xD8D1C4, signal:0xB7B3F9, signalCore:0x8B85EE, glow:0xE6DCC9, glowAlpha:0.7,
            fog:0xFFFFFF, ambient:0xFFFFFF, key:0xFFF8EC, rim:0xE0DFD6, emissive:0x000000,
            edgeOpacity:0.85, blending:THREE.NormalBlending, fogDensity:0.016 },
    silk: { node:0xE6DFD3, ring:0xE6DFD3, edge:0xD9D1C4, signal:0xB7B3F9, signalCore:0x8B85EE, glow:0xFFFFFF, glowAlpha:0.45,
            fog:0x8E877C, ambient:0xFFFFFF, key:0xFFF6E8, rim:0xE0DFD6, emissive:0x1A1714,
            edgeOpacity:0.7, blending:THREE.NormalBlending, fogDensity:0.016 },
  };
  opts.colors = Object.assign({}, THEMES[opts.theme]||THEMES.dark, opts.colors||{});

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isCoarse = window.matchMedia('(pointer: coarse)').matches;
  const C = opts.colors;

  const canvas = document.createElement('canvas');
  Object.assign(canvas.style, {position:'absolute', inset:'0', width:'100%', height:'100%', display:'block', pointerEvents:'none'});
  canvas.setAttribute('aria-hidden','true');
  container.appendChild(canvas);

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.autoClear = false;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(C.fog, C.fogDensity);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  camera.position.set(0, 0, 34);
  const world = new THREE.Group();
  scene.add(world);

  // ---------- procedural fabric backdrop ----------
  // Fully generated in a shader: large soft folds (domain-warped noise), a fine linen weave,
  // grain, and soft directional shading. No image is used.
  let bgScene=null, bgCam=null, bgMat=null;
  if(opts.fabric){
    const F = opts.fabricColors;
    bgScene = new THREE.Scene();
    bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    bgMat = new THREE.ShaderMaterial({
      uniforms:{
        time:{value:0}, wave:{value:opts.wave}, aspect:{value:1},
        mouse:{value:new THREE.Vector2(0.5,0.5)}, mouseStrength:{value:0}, shade:{value:opts.fabricShade},
        cLight:{value:new THREE.Color(F.light)}, cBase:{value:new THREE.Color(F.base)},
        cShade:{value:new THREE.Color(F.shade)}, cDeep:{value:new THREE.Color(F.deep)},
      },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
      fragmentShader:`
        precision highp float;
        uniform float time, wave, aspect, mouseStrength, shade; uniform vec2 mouse;
        uniform vec3 cLight, cBase, cShade, cDeep;
        varying vec2 vUv;

        // ---- noise (simplex, Ashima) ----
        vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
        vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
        vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
        float snoise(vec2 v){
          const vec4 C = vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
          vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
          vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0)) + i.x + vec3(0.0,i1.x,1.0));
          vec3 m = max(0.5 - vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0); m = m*m; m = m*m;
          vec3 x = 2.0*fract(p*C.www)-1.0; vec3 h = abs(x)-0.5; vec3 ox = floor(x+0.5); vec3 a0 = x-ox;
          m *= 1.79284291400159 - 0.85373472095314*(a0*a0+h*h);
          vec3 g; g.x = a0.x*x0.x + h.x*x0.y; g.yz = a0.yz*x12.xz + h.yz*x12.yw;
          return 130.0*dot(m,g);
        }
        float fbm(vec2 p){
          float f=0.0, a=0.6;
          for(int i=0;i<2;i++){ f += a*snoise(p); p = p*2.1 + 17.1; a *= 0.45; }
          return f;
        }
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

        // height field of the cloth: broad diagonal folds, warped so they curl and pile
        float height(vec2 p, float t){
          // very low-frequency warp so the drapes curl instead of running straight
          vec2 q = vec2(snoise(p*0.35 + vec2(0.0,t*0.3)), snoise(p*0.35 + vec2(5.2,1.3) - t*0.22));
          vec2 w = p + 0.7*q;
          float ph = w.x*0.9 - w.y*1.25 + t*0.35 + 0.8*snoise(w*0.25);
          // asymmetric drape: rounded crest, tighter trough, like cloth piled on itself
          float folds = sin(ph); folds = sign(folds)*pow(abs(folds), 0.7);
          float soft  = fbm(w*0.45 + t*0.1);
          return folds*0.72 + soft*0.28;
        }

        void main(){
          vec2 uv = vUv;
          vec2 p = (uv - 0.5) * vec2(aspect, 1.0) * 2.6;
          float t = time*0.12*wave;

          // cursor: a soft push on the cloth
          vec2 m = (mouse - 0.5) * vec2(aspect,1.0) * 2.6;
          float md = length(p - m);
          float push = exp(-md*md*1.2) * 0.25 * mouseStrength * wave;

          float e = 0.02;
          float h  = height(p, t) + push;
          float hx = height(p + vec2(e,0.0), t) + exp(-dot(p+vec2(e,0.0)-m, p+vec2(e,0.0)-m)*1.2)*0.25*mouseStrength*wave;
          float hy = height(p + vec2(0.0,e), t) + exp(-dot(p+vec2(0.0,e)-m, p+vec2(0.0,e)-m)*1.2)*0.25*mouseStrength*wave;
          vec3 n = normalize(vec3(-(hx-h)/e*0.5, -(hy-h)/e*0.5, 1.0));
          // curvature: positive on crests, negative in creases
          float curv = (2.0*h - hx - hy) / (e*e) * 0.0009;

          // lighting: soft key from upper left, broad fill, slight rim
          vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
          float diff = clamp(dot(n, L), 0.0, 1.0);
          float wrap = clamp(dot(n, L)*0.5 + 0.5, 0.0, 1.0);
          float sheen = pow(clamp(dot(n, normalize(L + vec3(0.0,0.0,1.0))), 0.0, 1.0), 14.0) * 0.10;
          float edgeLight = smoothstep(0.0, 0.5, curv) * 0.08;      // bright thread-lit crest lines
          float crease    = smoothstep(0.0, 0.6, -curv) * 0.12;     // soft shadow in the folds

          // colour: valleys go warm taupe, crests go to near white
          float depth = smoothstep(-0.9, 0.9, h);
          vec3 col = mix(cDeep, cShade, smoothstep(0.0, 0.5, depth));
          col = mix(col, cBase, smoothstep(0.3, 0.8, depth));
          col = mix(col, cLight, smoothstep(0.65, 1.0, depth) * 0.7);
          col *= 0.74 + 0.26*wrap + 0.14*diff;
          col = mix(col, cDeep, crease);
          col += sheen + edgeLight;

          // linen weave: two crossed thread directions, only visible where the cloth faces the camera
          // follows the cloth surface a little so it bends with the folds
          vec2 wuv = ((uv - 0.5) * vec2(aspect,1.0) + n.xy*0.02) * 900.0;
          float warp = sin(wuv.x + 0.6*sin(wuv.y*0.37));
          float weft = sin(wuv.y*1.13 + 0.6*sin(wuv.x*0.41));
          float weave = warp*weft;                     // crossed threads
          float facing = smoothstep(0.6, 1.0, n.z);
          col *= 1.0 + 0.035*weave*facing;
          // fibre grain and slub
          col += (hash(floor(wuv*0.9)) - 0.5) * 0.02 * facing;

          // slight vignette + top light haze, keeps overlaid text readable
          float vig = smoothstep(1.6, 0.4, length((uv-0.5)*vec2(aspect,1.0)*1.4));
          col = mix(col*0.96, col, vig);
          col = mix(col, vec3(1.0), 0.05*smoothstep(0.5,1.0,uv.y));
          // dark veil, a touch heavier on the left where the copy sits
          float veil = shade * (1.0 + 0.25*(1.0-uv.x));
          col = mix(col, vec3(0.16,0.14,0.12), clamp(veil,0.0,0.85));

          gl_FragColor = vec4(col, 1.0);
        }`,
      depthTest:false, depthWrite:false, toneMapped:false,
    });
    bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat));
  }
  scene.add(new THREE.AmbientLight(C.ambient, 0.35));
  const key = new THREE.DirectionalLight(C.key, 1.1); key.position.set(8,12,10); scene.add(key);
  const rim = new THREE.DirectionalLight(C.rim, 0.9); rim.position.set(-10,-4,-8); scene.add(rim);
  const cursorLight = new THREE.PointLight(C.signal, 0, 18, 2); scene.add(cursorLight);

  // ---------- glow texture ----------
  function makeGlow(inner, outer){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(64,64,0,64,64,64);
    grd.addColorStop(0, inner); grd.addColorStop(0.25, inner); grd.addColorStop(1, outer);
    g.fillStyle = grd; g.fillRect(0,0,128,128);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  const glowSignal = makeGlow('rgba(255,255,255,1)',   'rgba(255,255,255,0)');
  const glowNode   = makeGlow('rgba(255,255,255,0.9)', 'rgba(255,255,255,0)');

  function pointMaterial(tex, color, core){
    // core: optional {radius (0..0.5 of sprite), color} for a solid centre inside the glow
    return new THREE.ShaderMaterial({
      uniforms:{ map:{value:tex}, color:{value:new THREE.Color(color)}, alphaScale:{value:C.glowAlpha},
                 coreColor:{value:new THREE.Color(core?core.color:color)}, coreR:{value:core?core.radius:0.0} },
      vertexShader:`attribute float aSize; attribute float aAlpha; varying float vA;
        void main(){ vA=aAlpha; vec4 mv=modelViewMatrix*vec4(position,1.0);
          gl_PointSize=aSize*(420.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`uniform sampler2D map; uniform vec3 color; uniform vec3 coreColor; uniform float alphaScale; uniform float coreR; varying float vA;
        void main(){
          float a=texture2D(map,gl_PointCoord).a*vA*alphaScale;
          float d=distance(gl_PointCoord, vec2(0.5));
          float core = coreR>0.0 ? 1.0-smoothstep(coreR*0.8, coreR, d) : 0.0;
          vec3 c = mix(color, coreColor, core);
          gl_FragColor=vec4(c, max(a, core*vA));
        }`,
      transparent:true, depthWrite:false, blending:C.blending,
    });
  }

  // ---------- graph layout ----------
  const N = isCoarse ? Math.round(opts.nodes*0.6) : opts.nodes;
  const rng = mulberry32(2026);
  const nodes = [];
  const clusters = [
    {c:new THREE.Vector3( 4,  2, -2), r:8.5, w:0.45},
    {c:new THREE.Vector3(-6, -6, -8), r:7.0, w:0.30},
    {c:new THREE.Vector3(12, -4,  4), r:6.0, w:0.25},
  ];
  for(let i=0;i<N;i++){
    let u=rng(), cl=clusters[0], acc=0;
    for(const k of clusters){ acc+=k.w; if(u<=acc){ cl=k; break; } }
    const dir = new THREE.Vector3(rng()*2-1, rng()*2-1, rng()*2-1).normalize();
    const p = cl.c.clone().add(dir.multiplyScalar(cl.r*Math.cbrt(rng())));
    nodes.push({ base:p, pos:p.clone(), vel:new THREE.Vector3(), derived:false, size:0.16+rng()*0.22, heat:0 });
  }
  for(let it=0; it<40; it++){
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const d=nodes[i].base.clone().sub(nodes[j].base); const l=d.length();
      if(l<1.6 && l>1e-4){ d.multiplyScalar((1.6-l)/l*0.5); nodes[i].base.add(d); nodes[j].base.sub(d); }
    }
  }
  nodes.forEach(n=>n.pos.copy(n.base));

  const edgeSet=new Set(), edges=[];
  function addEdge(a,b){ if(a===b) return; const k=a<b?a+'-'+b:b+'-'+a; if(!edgeSet.has(k)){ edgeSet.add(k); edges.push([a,b]); } }
  const edgeWidth = [];   // px, filled after edges are known
  for(let i=0;i<N;i++){
    const ds=nodes.map((n,j)=>({j,d:i===j?Infinity:n.base.distanceTo(nodes[i].base)})).sort((a,b)=>a.d-b.d);
    const k=2+(rng()<0.5?1:0);
    for(let m=0;m<k;m++) if(ds[m].d<6) addEdge(i,ds[m].j);
  }
  for(let i=0;i<Math.floor(N*0.06);i++) addEdge(Math.floor(rng()*N), Math.floor(rng()*N));
  const adj=nodes.map(()=>[]);
  edges.forEach(([a,b],e)=>{ adj[a].push({to:b,e}); adj[b].push({to:a,e}); });
  // width: thicker between big nodes, thinner for long cross links, plus some variation
  edges.forEach(([a,b])=>{
    const sz=(nodes[a].size+nodes[b].size)/0.76;                 // ~0.4..1
    const len=nodes[a].base.distanceTo(nodes[b].base);
    let w = 0.5 + sz*1.6 + (rng()-0.5)*0.8;
    if(len>6) w*=0.55;
    edgeWidth.push(Math.max(0.35, Math.min(3.0, w)));
  });

  // ---------- meshes ----------
  const solidMat = new THREE.MeshStandardMaterial({ color:C.node, roughness:1, metalness:0, emissive:C.emissive, emissiveIntensity:0.5 });
  const hollowMat = new THREE.MeshStandardMaterial({ color:C.ring, roughness:0.9, metalness:0, emissive:C.emissive, emissiveIntensity:0.4 });
  const solidIdx=[], hollowIdx=[];
  nodes.forEach((n,i)=>(n.derived?hollowIdx:solidIdx).push(i));
  const solidMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1,28,20), solidMat, solidIdx.length);
  const hollowMesh = new THREE.InstancedMesh(new THREE.TorusGeometry(1,0.18,12,36), hollowMat, Math.max(1,hollowIdx.length));
  hollowMesh.count = hollowIdx.length;
  world.add(solidMesh); if(hollowIdx.length) world.add(hollowMesh);

  const glowGeo=new THREE.BufferGeometry();
  const glowPos=new Float32Array(N*3), glowSize=new Float32Array(N), glowAlpha=new Float32Array(N);
  glowGeo.setAttribute('position',new THREE.BufferAttribute(glowPos,3));
  glowGeo.setAttribute('aSize',new THREE.BufferAttribute(glowSize,1));
  glowGeo.setAttribute('aAlpha',new THREE.BufferAttribute(glowAlpha,1));
  world.add(new THREE.Points(glowGeo, pointMaterial(glowNode, C.glow)));

  // Edges as screen-space quads so each can have its own pixel width (WebGL ignores linewidth)
  const E=edges.length;
  const edgeGeo=new THREE.BufferGeometry();
  const eStart=new Float32Array(E*4*3), eEnd=new Float32Array(E*4*3), eSide=new Float32Array(E*4), eT=new Float32Array(E*4);
  const eWidth=new Float32Array(E*4), edgeCol=new Float32Array(E*4*3);
  const eIdx=new Uint32Array(E*6);
  for(let i=0;i<E;i++){
    for(let v=0;v<4;v++){ eSide[i*4+v]=(v%2)?1:-1; eT[i*4+v]=(v<2)?0:1; eWidth[i*4+v]=edgeWidth[i]; }
    eIdx.set([i*4,i*4+1,i*4+2, i*4+1,i*4+3,i*4+2], i*6);
  }
  edgeGeo.setAttribute('position',new THREE.BufferAttribute(eStart,3));   // start point (drives bounding sphere)
  edgeGeo.setAttribute('aEnd',new THREE.BufferAttribute(eEnd,3));
  edgeGeo.setAttribute('aSide',new THREE.BufferAttribute(eSide,1));
  edgeGeo.setAttribute('aT',new THREE.BufferAttribute(eT,1));
  edgeGeo.setAttribute('aWidth',new THREE.BufferAttribute(eWidth,1));
  edgeGeo.setAttribute('color',new THREE.BufferAttribute(edgeCol,3));
  edgeGeo.setIndex(new THREE.BufferAttribute(eIdx,1));
  const edgeMat=new THREE.ShaderMaterial({
    uniforms:{ resolution:{value:new THREE.Vector2(1,1)}, opacity:{value:C.edgeOpacity}, fogColor:{value:new THREE.Color(C.fog)}, fogDensity:{value:C.fogDensity} },
    vertexShader:`
      attribute vec3 aEnd; attribute float aSide, aT, aWidth; attribute vec3 color;
      uniform vec2 resolution; varying vec3 vColor; varying float vFog;
      float fogDensityConst(){ return 0.0; }
      void main(){
        vec4 a = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        vec4 b = projectionMatrix * modelViewMatrix * vec4(aEnd,1.0);
        vec4 c = mix(a,b,aT);
        vec2 sa = a.xy/a.w*resolution, sb = b.xy/b.w*resolution;
        vec2 dir = normalize(sb - sa + 1e-6); vec2 nrm = vec2(-dir.y, dir.x);
        vec2 off = nrm * aSide * aWidth * 0.5;   // half width in px
        c.xy += off / resolution * c.w;
        gl_Position = c;
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(mix(position,aEnd,aT),1.0);
        vFog = 1.0 - exp(-fogDensityConst()*fogDensityConst()*mv.z*mv.z);
      }`,
    fragmentShader:`
      uniform float opacity; uniform vec3 fogColor; varying vec3 vColor; varying float vFog;
      void main(){ gl_FragColor = vec4(mix(vColor, fogColor, vFog), opacity); }`,
    transparent:true, depthWrite:false, blending:C.blending, side:THREE.DoubleSide,
  });
  // fog needs the density inside the vertex shader; patch it in as a literal
  edgeMat.vertexShader = edgeMat.vertexShader.replace('return 0.0;', 'return '+C.fogDensity.toFixed(4)+';');
  world.add(new THREE.Mesh(edgeGeo, edgeMat));
  const edgeHeat=new Float32Array(edges.length);
  const cEdge=new THREE.Color(C.edge), cHot=new THREE.Color(C.signal);

  const MAXS = Math.max(6, Math.round((isCoarse ? 40 : 90) * opts.activity)), TRAIL = 6;
  const signals=[];
  const sigGeo=new THREE.BufferGeometry();
  const sigPos=new Float32Array(MAXS*TRAIL*3), sigSize=new Float32Array(MAXS*TRAIL), sigAlpha=new Float32Array(MAXS*TRAIL);
  sigGeo.setAttribute('position',new THREE.BufferAttribute(sigPos,3));
  sigGeo.setAttribute('aSize',new THREE.BufferAttribute(sigSize,1));
  sigGeo.setAttribute('aAlpha',new THREE.BufferAttribute(sigAlpha,1));
  world.add(new THREE.Points(sigGeo, pointMaterial(glowSignal, C.signal, {radius:0.16, color:C.signalCore})));

  function spawnSignal(from, hops){
    if(signals.length>=MAXS || !adj[from].length) return;
    const link=adj[from][Math.floor(Math.random()*adj[from].length)];
    signals.push({ from, to:link.to, e:link.e, t:0, speed:0.45+Math.random()*0.35, hops:hops??(2+Math.floor(Math.random()*2)), hist:[] });
  }

  // ---------- interaction ----------
  const mouse=new THREE.Vector2(0,0), target={rx:0,ry:0};
  const cursor3=new THREE.Vector3(1e3,1e3,1e3), cursorGoal=new THREE.Vector3(1e3,1e3,1e3);
  let cursorActive=false, cursorSettled=false;
  const raycaster=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  function onPointer(e){
    const r=container.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1;
    mouse.y=-(((e.clientY-r.top)/r.height)*2-1);
    cursorActive = mouse.x>-1 && mouse.x<1 && mouse.y>-1 && mouse.y<1;
  }
  function onLeave(){ cursorActive=false; }
  opts.pointerTarget.addEventListener('pointermove', onPointer, {passive:true});
  opts.pointerTarget.addEventListener('pointerleave', onLeave);
  document.addEventListener('mouseleave', onLeave);

  function resize(){
    const w=container.clientWidth, h=container.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
    if(bgMat) bgMat.uniforms.aspect.value = w/h;
    edgeMat.uniforms.resolution.value.set(w*0.5*renderer.getPixelRatio(), h*0.5*renderer.getPixelRatio());
    if(ready){ renderer.clear(); if(bgMat) renderer.render(bgScene,bgCam); renderer.render(scene,camera); }
    // map anchor (0..1) to world units at the graph's depth
    const vh = 2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.position.z;
    const vw = vh*camera.aspect;
    world.position.x = (opts.anchorX-0.5)*vw - 4;   // -4 offsets the cluster centre of mass
    world.position.y = (0.5-opts.anchorY)*vh + 1;
  }
  let ready=false;
  const ro = new ResizeObserver(resize); ro.observe(container); resize();

  // ---------- loop ----------
  const dummy=new THREE.Object3D(), tmp=new THREE.Vector3(), tmp2=new THREE.Vector3();
  let last=performance.now(), spawnAcc=0, cursorSpawnAcc=0, raf=0, running=true;
  for(let i=0;i<Math.round(6*opts.activity)+1;i++) spawnSignal(Math.floor(Math.random()*N));

  function frame(now){
    if(!running) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;

    const drift = (reduceMotion||!opts.drift) ? 0 : t*0.04;
    target.ry = mouse.x*opts.tilt + drift; target.rx = -mouse.y*opts.tilt*0.6;
    const rotEase = 1 - Math.pow(0.001, dt*0.25);      // ~3s to settle
    world.rotation.y += (target.ry-world.rotation.y)*rotEase;
    world.rotation.x += (target.rx-world.rotation.x)*rotEase;
    world.updateMatrixWorld();

    if(cursorActive && !isCoarse){
      raycaster.setFromCamera(mouse, camera);
      plane.setFromNormalAndCoplanarPoint(tmp.set(0,0,1), world.position);
      const hit=raycaster.ray.intersectPlane(plane, tmp2);
      if(hit){
        cursorGoal.copy(world.worldToLocal(hit.clone()));
        if(!cursorSettled){ cursor3.copy(cursorGoal); cursorSettled=true; }
        const ease = 1 - Math.pow(0.001, dt*0.6);   // cursor point trails the mouse
        cursor3.lerp(cursorGoal, ease);
        cursorLight.position.copy(world.localToWorld(tmp.copy(cursor3)));
      }
      cursorLight.intensity += (3.2-cursorLight.intensity)*0.05;
    } else { cursorSettled=false; cursor3.set(1e3,1e3,1e3); cursorLight.intensity*=0.95; }

    let nearest=-1, nearestD=Infinity;
    for(let i=0;i<N;i++){
      const n=nodes[i];
      tmp.copy(n.base).sub(n.pos).multiplyScalar(3.5); n.vel.add(tmp.multiplyScalar(dt));
      tmp.copy(cursor3).sub(n.pos); tmp.z=0;
      const d=tmp.length();
      if(d<9){
        const f=(1-d/9); n.vel.add(tmp.normalize().multiplyScalar(f*f*3.5*dt));
        n.heat=Math.min(1,n.heat+f*dt*1.2);
        if(d<nearestD){ nearestD=d; nearest=i; }
      }
      n.heat=Math.max(0,n.heat-dt*0.5);
      n.vel.multiplyScalar(Math.pow(0.06,dt));
      n.pos.add(tmp.copy(n.vel).multiplyScalar(dt));

    }

    let si=0, hi=0;
    for(let i=0;i<N;i++){
      const n=nodes[i], s=n.size*(1+n.heat*0.6);
      dummy.position.copy(n.pos); dummy.rotation.set(i*0.7, i*1.3, 0); dummy.scale.setScalar(s); dummy.updateMatrix();
      if(n.derived) hollowMesh.setMatrixAt(hi++,dummy.matrix); else solidMesh.setMatrixAt(si++,dummy.matrix);
      glowPos[i*3]=n.pos.x; glowPos[i*3+1]=n.pos.y; glowPos[i*3+2]=n.pos.z;
      glowSize[i]=n.size*6+n.heat*3; glowAlpha[i]=0.3+n.heat*0.5;
    }
    solidMesh.instanceMatrix.needsUpdate=true; hollowMesh.instanceMatrix.needsUpdate=true;
    glowGeo.attributes.position.needsUpdate=true; glowGeo.attributes.aSize.needsUpdate=true; glowGeo.attributes.aAlpha.needsUpdate=true;

    spawnAcc+=dt; cursorSpawnAcc+=dt;
    const interval = (reduceMotion?2.5:0.6) / Math.max(0.05, opts.activity);
    if(spawnAcc>interval){ spawnAcc=0; spawnSignal(Math.floor(Math.random()*N)); }
    if(nearest>=0 && cursorSpawnAcc>0.45){ cursorSpawnAcc=0; spawnSignal(nearest,3); }

    for(let i=0;i<edges.length;i++) edgeHeat[i]=Math.max(0,edgeHeat[i]-dt*0.9);
    for(let s=signals.length-1;s>=0;s--){
      const sg=signals[s]; sg.t+=dt*sg.speed; edgeHeat[sg.e]=Math.min(1,edgeHeat[sg.e]+dt*4);
      const p=tmp.copy(nodes[sg.from].pos).lerp(nodes[sg.to].pos, Math.min(1,sg.t));
      sg.hist.unshift([p.x,p.y,p.z]); if(sg.hist.length>TRAIL) sg.hist.length=TRAIL;
      if(sg.t>=1){
        nodes[sg.to].heat=Math.min(1,nodes[sg.to].heat+0.5);
        if(--sg.hops>0){
          const opt=adj[sg.to].filter(l=>l.to!==sg.from); const pool=opt.length?opt:adj[sg.to];
          const link=pool[Math.floor(Math.random()*pool.length)];
          if(link){ sg.from=sg.to; sg.to=link.to; sg.e=link.e; sg.t=0; continue; }
        }
        signals.splice(s,1);
      }
    }
    let w=0;
    for(let s=0;s<MAXS;s++){ const sg=signals[s];
      for(let k=0;k<TRAIL;k++,w++){
        if(sg && sg.hist[k]){ sigPos[w*3]=sg.hist[k][0]; sigPos[w*3+1]=sg.hist[k][1]; sigPos[w*3+2]=sg.hist[k][2];
          const f=1-k/TRAIL; sigSize[w]=k===0?1.9:1.2*f; sigAlpha[w]=k===0?1:0.4*f; }
        else { sigSize[w]=0; sigAlpha[w]=0; }
      }
    }
    sigGeo.attributes.position.needsUpdate=true; sigGeo.attributes.aSize.needsUpdate=true; sigGeo.attributes.aAlpha.needsUpdate=true;

    for(let i=0;i<E;i++){
      const [a,b]=edges[i], pa=nodes[a].pos, pb=nodes[b].pos;
      const h=edgeHeat[i]+Math.max(nodes[a].heat,nodes[b].heat)*0.35;
      const c=tmp2.set(cEdge.r,cEdge.g,cEdge.b).lerp(tmp.set(cHot.r,cHot.g,cHot.b), Math.min(1,h));
      for(let v=0;v<4;v++){
        const o=(i*4+v)*3;
        eStart[o]=pa.x; eStart[o+1]=pa.y; eStart[o+2]=pa.z;
        eEnd[o]=pb.x; eEnd[o+1]=pb.y; eEnd[o+2]=pb.z;
        edgeCol[o]=c.x; edgeCol[o+1]=c.y; edgeCol[o+2]=c.z;
      }
    }
    edgeGeo.attributes.position.needsUpdate=true; edgeGeo.attributes.aEnd.needsUpdate=true; edgeGeo.attributes.color.needsUpdate=true;
    edgeGeo.computeBoundingSphere();

    renderer.clear();
    if(bgMat){
      const u=bgMat.uniforms;
      u.time.value = reduceMotion ? 0 : t;
      u.mouse.value.lerp(tmp2.set((mouse.x+1)/2, (mouse.y+1)/2, 0), 0.05);
      u.mouseStrength.value += ((cursorActive && !isCoarse ? 1 : 0) - u.mouseStrength.value)*0.04;
      renderer.render(bgScene, bgCam);
    }
    renderer.render(scene,camera);
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame); ready=true;

  // pause when off-screen
  const io = new IntersectionObserver(([e])=>{
    if(e.isIntersecting && !running){ running=true; last=performance.now(); raf=requestAnimationFrame(frame); }
    else if(!e.isIntersecting){ running=false; cancelAnimationFrame(raf); }
  });
  io.observe(container);

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }

  return {
    destroy(){
      running=false; cancelAnimationFrame(raf); ro.disconnect(); io.disconnect();
      opts.pointerTarget.removeEventListener('pointermove', onPointer);
      opts.pointerTarget.removeEventListener('pointerleave', onLeave);
      document.removeEventListener('mouseleave', onLeave);
      renderer.dispose(); canvas.remove();
    }
  };
}

// Demo mount
// Container class picks the look: "silk" (hero photo), "light" (white + beige) or none (brand navy).
const el = document.getElementById('kg-bg');
const theme = el.classList.contains('silk') ? 'silk' : el.classList.contains('light') ? 'light' : 'dark';
if(theme==='dark') el.classList.add('dark');
KnowledgeGraphBackground(el, { anchorX:0.8, anchorY:0.5, theme, fabric: theme==='silk' });
</script>
